[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "peer-samplers"
version = "0.1.0"
description = "Reproducible discrete-event comparisons of decentralized peer samplers"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
peer-sim = "peer_sim.cli:main"

[tool.setuptools.packages.find]
include = ["peer_sim*"]
